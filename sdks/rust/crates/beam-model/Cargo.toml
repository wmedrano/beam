[package]
name = "beam-model"
description = "Private portability protocol implementation for the experimental Beam Rust SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
readme = "../../README.md"

[dependencies]
protobuf.workspace = true
protobuf-well-known-types.workspace = true
tonic.workspace = true
bytes.workspace = true
grpc = { workspace = true, optional = true }
grpc-protobuf = { workspace = true, optional = true }

[features]
official-grpc-probe = ["dep:grpc", "dep:grpc-protobuf"]

[dev-dependencies]
tokio.workspace = true
tokio-stream.workspace = true
serde_json = "1"
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
