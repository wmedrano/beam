[workspace]
members = ["crates/beam-model", "crates/beam-coders", "crates/beam"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/apache/beam"
homepage = "https://beam.apache.org"

[workspace.dependencies]
protobuf = "=4.34.0-release"
protobuf-well-known-types = "=4.34.0-release"
grpc = "=0.9.0"
grpc-protobuf = "=0.9.0"
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "codegen", "tls-ring"] }
bytes = "1"
tokio-stream = "0.1"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
