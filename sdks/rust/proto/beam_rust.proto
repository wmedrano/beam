syntax = "proto3";
package org.apache.beam.sdk.rust.v1;

// Private SDK payload, carried only inside the do_fn FunctionSpec of a
// standard ParDoPayload. Version and identity checks precede user setup.
message RustFunctionPayload {
  uint32 version = 1;
  string function_id = 2;
  string config_contract = 3;
  uint32 config_version = 4;
  bytes config = 5;
  bytes registry_digest = 6;
  string build_id = 7;
}
